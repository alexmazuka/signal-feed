name: build-and-post
on:
  push:
    branches: [main]
    paths: ["data/items.json", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: signal-feed
jobs:
  run:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build.py
      - run: python3 scripts/post_tg.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      - run: |
          git config user.name signal-feed-bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "slugs/posted" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site_out }
      - uses: actions/deploy-pages@v4
