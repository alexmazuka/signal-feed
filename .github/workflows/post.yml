name: post-to-telegram
on:
  push:
    paths: ["data/items.json"]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/post_tg.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      - run: |
          git config user.name signal-feed-bot && git config user.email bot@users.noreply.github.com
          git add data/posted.json && git commit -m "posted" && git push || true
