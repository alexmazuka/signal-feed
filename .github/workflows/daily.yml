name: daily-issue
on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Київ (літо 08:00, взимку 07:00)
  workflow_dispatch:
permissions:
  contents: write
concurrency: signal-feed
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q feedparser trafilatura
      - run: python3 scripts/collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: python3 scripts/post_tg.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      - run: |
          git config user.name signal-feed-bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "Випуск $(date +%F)" && git push || true
