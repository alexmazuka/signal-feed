name: daily-issue
on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Київ влітку, 07:00 взимку
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: signal-feed
jobs:
  run:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q feedparser trafilatura
      - run: python3 scripts/collect.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name signal-feed-bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "Собрано $(date +%F)" && git push || true
      - run: python3 scripts/build.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          SUBSCRIBE_ACTION: ${{ vars.SUBSCRIBE_ACTION }}
          GSC_VERIFY: ${{ vars.GSC_VERIFY }}
      - run: python3 scripts/post_tg.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      - run: |
          git config user.name signal-feed-bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "Выпуск $(date +%F)" && git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site_out }
      - uses: actions/deploy-pages@v4
      - run: sleep 60 && PYTHONPATH=scripts python3 scripts/indexnow.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
